[project]
name = "attention-triage"
version = "0.1.0"
description = "Shows the few Claude Code actions that need a human decision."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
triage = "attention_triage.cli:main"
triage-hook = "attention_triage.hook:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.10",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length is left to the formatter
